{{- if not .Values.existingSecret }}
{{- $fullName := include "fd-commander.fullname" . }}
{{- /*
Reuse any previously generated values so a `helm upgrade` does not roll the
APP_KEY (which would invalidate every encrypted column and session) or the
Reverb credentials.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $fullName) | default dict }}
{{- $existingData := get $existing "data" | default dict }}
{{- $appKey := .Values.app.key }}
{{- if not $appKey }}
{{- $appKey = (get $existingData "APP_KEY" | b64dec) | default (printf "base64:%s" (randAlphaNum 32 | b64enc)) }}
{{- end }}
{{- $reverbKey := (get $existingData "REVERB_APP_KEY" | b64dec) | default (randAlphaNum 20) }}
{{- $reverbSecret := (get $existingData "REVERB_APP_SECRET" | b64dec) | default (randAlphaNum 20) }}
{{- $reverbId := (get $existingData "REVERB_APP_ID" | b64dec) | default (randNumeric 8) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "fd-commander.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ $appKey | quote }}
  {{- /*
  Database and Redis passwords are only stored here when pointing at an
  external server. With the bundled subcharts the subchart owns the
  credential and the deployment reads it straight from the subchart's own
  secret, so that a generated password cannot drift between the two.
  */}}
  {{- if not .Values.mysql.enabled }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- if and (not .Values.redis.enabled) .Values.externalRedis.host .Values.externalRedis.password }}
  REDIS_PASSWORD: {{ .Values.externalRedis.password | quote }}
  {{- end }}
  REVERB_APP_KEY: {{ $reverbKey | quote }}
  REVERB_APP_SECRET: {{ $reverbSecret | quote }}
  REVERB_APP_ID: {{ $reverbId | quote }}
  {{- if .Values.mail.password }}
  MAIL_PASSWORD: {{ .Values.mail.password | quote }}
  {{- end }}
{{- end }}
